name: Monitor X for reset

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification to verify delivery (Gmail SMTP)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: write

concurrency:
  group: reset-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_PROVIDER: ${{ vars.SOURCE_PROVIDER || 'fxembed' }}
      X_USERNAME: ${{ vars.X_USERNAME || 'thsottiaux' }}
      MATCH_WORD: ${{ vars.MATCH_WORD || 'reset' }}
      X_EXCLUDE_REPLIES: ${{ vars.X_EXCLUDE_REPLIES || 'false' }}
      BOOTSTRAP_NOTIFY: "false"
      TARGET_TIMEZONE: ${{ vars.TARGET_TIMEZONE || 'Asia/Shanghai' }}
      SOURCE_TIMEZONE: ${{ vars.SOURCE_TIMEZONE }}
      INCLUDE_MENTIONS: ${{ vars.INCLUDE_MENTIONS || 'true' }}
      WEBHOOK_DEBUG: ${{ vars.WEBHOOK_DEBUG || 'false' }}
      STATE_PATH: runtime/state.json
      PUBLIC_STATUS_PATH: runtime/status.json

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout isolated runtime state
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: runtime
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitor/package-lock.json
      # Install only the isolated CLI runtime, never the web/test dependency tree.
      - run: npm ci --ignore-scripts
        working-directory: monitor
      - name: Verify notification secrets configuration
        env:
          HAS_GMAIL_USER: ${{ secrets.GMAIL_USER != '' }}
          HAS_GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD != '' }}
          HAS_EMAIL_TO: ${{ (secrets.EMAIL_TO || secrets.EMAIL_T0) != '' }}
          HAS_EMAIL_T0: ${{ secrets.EMAIL_T0 != '' }}
        run: |
          node -e '
            console.log("Notification secrets presence check (boolean only):");
            console.log("  GMAIL_USER:", process.env.HAS_GMAIL_USER === "true");
            console.log("  GMAIL_APP_PASSWORD:", process.env.HAS_GMAIL_APP_PASSWORD === "true");
            console.log("  EMAIL_TO:", process.env.HAS_EMAIL_TO === "true");
            console.log("  EMAIL_T0:", process.env.HAS_EMAIL_T0 === "true");
          '
      - name: Run monitor
        id: monitor
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
          WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.EMAIL_T0 }}
          EMAIL_T0: ${{ secrets.EMAIL_T0 }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
        run: |
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            npm --prefix monitor run monitor -- --test-notify
          else
            npm --prefix monitor run monitor
          fi
      - name: Publish GitHub Actions summary
        if: always() && steps.monitor.outcome != 'skipped'
        run: node scripts/actions-summary.mjs
      - name: Persist runtime state even after notification failure
        id: persist
        if: always() && steps.monitor.outcome != 'skipped'
        working-directory: runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- state.json status.json feed.xml)" ]; then
            exit 0
          fi
          git config user.name "reset-signal[bot]"
          git config user.email "reset-signal[bot]@users.noreply.github.com"
          git add state.json status.json feed.xml
          git commit -m "chore: update monitor runtime state"
          # Authenticate only these Git operations, never dependency installation.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth_header"
          git -c http.https://github.com/.extraheader="$auth_header" pull --rebase origin monitor-state
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:monitor-state
      - name: Keep recovery checkpoint if runtime persistence failed
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-recovery
          path: |
            runtime/state.json
            runtime/status.json
            runtime/feed.xml
          retention-days: 7

