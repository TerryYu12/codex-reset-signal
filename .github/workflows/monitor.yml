name: Monitor X for reset

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification to verify delivery (Gmail SMTP)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: reset-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_PROVIDER: ${{ vars.SOURCE_PROVIDER || 'fxembed' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_USERNAME: ${{ vars.X_USERNAME || 'thsottiaux' }}
      MATCH_WORD: ${{ vars.MATCH_WORD || 'reset' }}
      X_EXCLUDE_REPLIES: ${{ vars.X_EXCLUDE_REPLIES || 'false' }}
      BOOTSTRAP_NOTIFY: "false"
      TARGET_TIMEZONE: ${{ vars.TARGET_TIMEZONE || 'Asia/Shanghai' }}
      SOURCE_TIMEZONE: ${{ vars.SOURCE_TIMEZONE }}
      INCLUDE_MENTIONS: ${{ vars.INCLUDE_MENTIONS || 'true' }}
      WEBHOOK_DEBUG: ${{ vars.WEBHOOK_DEBUG || 'false' }}
      STATE_PATH: runtime/state.json
      PUBLIC_STATUS_PATH: runtime/status.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      DISCORD_WEBHOOK_URLS: ${{ secrets.DISCORD_WEBHOOK_URLS }}
      WEBHOOK_URLS: ${{ secrets.WEBHOOK_URLS }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO || secrets.EMAIL_T0 }}
      EMAIL_T0: ${{ secrets.EMAIL_T0 }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      SMS_TO: ${{ secrets.SMS_TO }}

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Checkout isolated runtime state
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: runtime
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify notification secrets configuration
        run: |
          node -e '
            console.log("Notification secrets presence check (boolean only):");
            console.log("  GMAIL_USER:", Boolean(process.env.GMAIL_USER));
            console.log("  GMAIL_APP_PASSWORD:", Boolean(process.env.GMAIL_APP_PASSWORD));
            console.log("  EMAIL_TO:", Boolean(process.env.EMAIL_TO));
            console.log("  EMAIL_T0:", Boolean(process.env.EMAIL_T0));
          '
      - name: Run monitor
        id: monitor
        run: |
          if [ "${{ github.event.inputs.test_notify }}" = "true" ]; then
            npm run monitor -- --test-notify
          else
            npm run monitor
          fi
      - name: Publish GitHub Actions summary
        if: always() && steps.monitor.outcome != 'skipped'
        run: node scripts/actions-summary.mjs
      - name: Persist runtime state even after notification failure
        id: persist
        if: always() && steps.monitor.outcome != 'skipped'
        working-directory: runtime
        run: |
          if [ -z "$(git status --porcelain -- state.json status.json feed.xml)" ]; then
            exit 0
          fi
          git config user.name "reset-signal[bot]"
          git config user.email "reset-signal[bot]@users.noreply.github.com"
          git add state.json status.json feed.xml
          git commit -m "chore: update monitor runtime state"
          git pull --rebase origin monitor-state
          git push origin HEAD:monitor-state
      - name: Keep recovery checkpoint if runtime persistence failed
        if: failure() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-state-recovery
          path: |
            runtime/state.json
            runtime/status.json
            runtime/feed.xml
          retention-days: 7
